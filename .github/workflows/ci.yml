name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-validate:
    name: Backend Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 -timeout 300s ./...

      - name: Build
        run: go build ./...

  frontend-validate:
    name: Frontend Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@499170d96c583f6812e20f444f95c6e587bd3b21 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test -- --run

      - name: Build
        run: npm run build

  docker-backend:
    name: Docker Backend
    needs: backend-validate
    uses: minisource/.github/.github/workflows/build-and-push.yml@main
    with:
      image-name: ${{ secrets.DOCKERHUB_USERNAME }}/auth-backend
      dockerfile-path: backend/Dockerfile
      build-context: .
    secrets: inherit

  docker-frontend:
    name: Docker Frontend
    needs: frontend-validate
    uses: minisource/.github/.github/workflows/build-and-push.yml@main
    with:
      image-name: ${{ secrets.DOCKERHUB_USERNAME }}/auth-frontend
      dockerfile-path: front/Dockerfile
      build-context: .
    secrets: inherit
