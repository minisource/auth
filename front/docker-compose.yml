version: '3.8'

services:
  frontend:
    build:
      context: ../..
      dockerfile: auth/front/Dockerfile
    container_name: minisource-auth-frontend
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-Minisource Auth}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3003}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:9001/v1}
      - OTEL_ENABLED=true
      - OTEL_SERVICE_NAME=auth-frontend
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://minisource-otel-collector:4318/v1/traces
    networks:
      - minisource-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3003/auth/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  minisource-network:
    external: true
